name: Monitor

on:
  schedule:
    # Run once daily at 06:30 UTC
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      email_provider:
        description: 'Email provider (mock = no credentials needed)'
        type: choice
        default: mock
        options:
          - mock
          - gmail
      game_collector:
        description: 'Game collector'
        type: choice
        default: deku
        options:
          - deku
          - mock

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve run configuration
        shell: bash
        run: |
          EMAIL_PROVIDER="${{ inputs.email_provider || secrets.EMAIL_PROVIDER || 'gmail' }}"
          GAME_COLLECTOR="${{ inputs.game_collector || secrets.GAME_COLLECTOR || 'deku' }}"
          echo "EMAIL_PROVIDER=$EMAIL_PROVIDER" >> "$GITHUB_ENV"
          echo "GAME_COLLECTOR=$GAME_COLLECTOR" >> "$GITHUB_ENV"
          echo "::notice::Resolved configuration -> EMAIL_PROVIDER=$EMAIL_PROVIDER, GAME_COLLECTOR=$GAME_COLLECTOR"

      - name: Run monitoring pipeline
        env:
          EMAIL_PROVIDER: ${{ env.EMAIL_PROVIDER }}
          GAME_COLLECTOR: ${{ env.GAME_COLLECTOR }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          DEALS_SOURCE_URL: ${{ secrets.DEALS_SOURCE_URL }}
          DEALS_CURRENCY: ${{ secrets.DEALS_CURRENCY }}
          MIN_DEAL_SCORE: ${{ secrets.MIN_DEAL_SCORE }}
          MOCK_EMAIL_OUT_DIR: data/emails
        run: npm run monitor

      - name: Upload mock email artifact
        if: env.EMAIL_PROVIDER == 'mock'
        uses: actions/upload-artifact@v4
        with:
          name: monitor-emails
          path: data/emails
          if-no-files-found: ignore
