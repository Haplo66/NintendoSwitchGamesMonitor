name: Monitor

on:
  schedule:
    # Run once daily at 06:30 UTC
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      email_provider:
        description: 'Email provider (mock = no credentials needed)'
        type: choice
        default: mock
        options:
          - mock
          - gmail
      game_collector:
        description: 'Game collector'
        type: choice
        default: nintendo
        options:
          - nintendo
          - mock
      dry_run:
        description: 'Dry run (full pipeline, no email sent, no history written)'
        type: boolean
        default: false
      force_email:
        description: 'Force email (send the digest even with 0 new notifications, no history written)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve run configuration
        shell: bash
        run: |
          EMAIL_PROVIDER="${{ inputs.email_provider || secrets.EMAIL_PROVIDER || 'gmail' }}"
          GAME_COLLECTOR="${{ inputs.game_collector || secrets.GAME_COLLECTOR || 'nintendo' }}"
          NINTENDO_PLATFORM="${NINTENDO_PLATFORM:-switch1}"
          echo "EMAIL_PROVIDER=$EMAIL_PROVIDER" >> "$GITHUB_ENV"
          echo "GAME_COLLECTOR=$GAME_COLLECTOR" >> "$GITHUB_ENV"
          echo "NINTENDO_PLATFORM=$NINTENDO_PLATFORM" >> "$GITHUB_ENV"
          echo "::notice::Resolved configuration -> EMAIL_PROVIDER=$EMAIL_PROVIDER, GAME_COLLECTOR=$GAME_COLLECTOR, NINTENDO_PLATFORM=$NINTENDO_PLATFORM"

      - name: Run monitoring pipeline
        env:
          EMAIL_PROVIDER: ${{ env.EMAIL_PROVIDER }}
          GAME_COLLECTOR: ${{ env.GAME_COLLECTOR }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NINTENDO_PLATFORM: ${{ env.NINTENDO_PLATFORM }}
          DEALS_CURRENCY: ${{ secrets.DEALS_CURRENCY }}
          GAME_CATALOG: ${{ secrets.GAME_CATALOG }}
          MIN_DEAL_SCORE: ${{ secrets.MIN_DEAL_SCORE }}
          MAX_GAMES_PER_EMAIL: ${{ secrets.MAX_GAMES_PER_EMAIL }}
          NOTIFY_FREE_GAMES: ${{ secrets.NOTIFY_FREE_GAMES }}
          NOTIFY_WISHLIST_MATCHES: ${{ secrets.NOTIFY_WISHLIST_MATCHES }}
          MOCK_EMAIL_OUT_DIR: data/emails
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.dry_run }}" == "true" ]; then EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"; fi
          if [ "${{ inputs.force_email }}" == "true" ]; then EXTRA_FLAGS="$EXTRA_FLAGS --force-email"; fi
          npm run monitor -- $EXTRA_FLAGS

      - name: Upload mock email artifact
        if: env.EMAIL_PROVIDER == 'mock'
        uses: actions/upload-artifact@v4
        with:
          name: monitor-emails
          path: data/emails
          if-no-files-found: ignore
